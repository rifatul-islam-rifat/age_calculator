<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Age calculator</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <div class="container">
        <h1>Age calculator</h1>
        <p>Calculate your exact age in years, months and days.</p>

        <label for="date">Your birth date</label>
        <input type="date" id="date" required>
        <button id="calculateBtn">Calculate</button>

        <div class="result">
            <h2>Your age is:</h2>

            <div class="dates">

                <div class="cart">
                    <h2 id="year">18</h2>
                    <p>YEARS</p>
                </div>
                 <div class="cart">
                    <h2 id="months">18</h2>
                    <p>MONTHS</p>
                </div>
                 <!-- <div class="cart">
                    <h2 id="days">18</h2>
                    <p>DAYS</p>
                </div> -->

            </div>
        </div>
    </div>
    




    <script src="./script.js"></script>
</body>
</html>
